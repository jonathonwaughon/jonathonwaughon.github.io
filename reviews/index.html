<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews | JR Waughon</title>
  <meta name="description" content="Comments and reviews from visitors to JR Waughon's portfolio.">
  <meta name="theme-color" content="#0b1120">
  <link rel="canonical" href="https://jonathonwaughon.github.io/reviews/">

  <!-- icons -->
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">

  <!-- link previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JR Waughon">
  <meta property="og:title" content="Reviews | JR Waughon">
  <meta property="og:description" content="Comments and reviews from visitors.">
  <meta property="og:url" content="https://jonathonwaughon.github.io/reviews/">
  <meta property="og:image" content="https://jonathonwaughon.github.io/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/calm.css">
  <link rel="stylesheet" href="../css/scrollbar.css">
  <!-- calm mode switch; runs early so a calm page never flashes the animated one -->
  <script src="../js/calm.js"></script>
  <style>
    /* page-specific bits (the rest comes from home.css) */
    .reviews { padding: 90px 0 80px; }
    .reviews h1 { font-size: clamp(36px, 6vw, 52px); line-height: 1.1; margin-bottom: 12px; }
    .reviews h1 span {
      background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .reviews .lede { color: var(--muted); font-size: 17px; max-width: 520px; margin-bottom: 36px; }
    .reviews-empty {
      border: 1px dashed var(--border); border-radius: 14px;
      background: rgba(17, 26, 46, 0.6);
      padding: 40px 24px; text-align: center; color: var(--muted);
    }
    .reviews-empty .big { font-size: 34px; display: block; margin-bottom: 8px; }
    .js .reviews .anim { animation: fadeUp .8s var(--ease-out) backwards; animation-delay: calc(.15s + var(--o) * 100ms); }
    @media (max-width: 700px) { .reviews { padding: 48px 0 56px; } }
  </style>
</head>
<!-- data-root = path from this page to the site root (used by the shared sidebar) -->
<body class="has-sidebar" data-root="../">

  <a class="skip-link" href="#main">Skip to content</a>

  <canvas id="ocean" aria-hidden="true"></canvas>

  <!-- Mobile-only top bar -->
  <div class="topbar">
    <button class="menu-btn" type="button" data-nav-toggle aria-label="Open navigation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a href="../" class="logo">JR Waughon</a>
  </div>

  <main id="main">
    <section class="reviews">
      <div class="container">
        <h1 class="anim" style="--o:0"><span>Reviews</span></h1>
        <p class="lede anim" style="--o:1">What visitors have to say about the site (or me).</p>

        <!-- REVIEWS GO HERE (placeholder until the guestbook is built) -->
        <div class="reviews-empty anim" style="--o:2">
          <span class="big" aria-hidden="true">🫧</span>
          Nothing here yet. Reviews are coming soon.
        </div>
      </div>
    </section>
  </main>

  <script src="../js/nav.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/ocean.js"></script>
</body>
</html>
